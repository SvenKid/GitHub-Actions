name: Java CI

on:
  push:
    branches: [main, 'demo/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Run the application
        run: java -jar target/calculator-1.0.0.jar add 2 3

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Save the application
        uses: actions/upload-artifact@v6
        with:
          name: calculator-jar
          path: target/calculator-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
